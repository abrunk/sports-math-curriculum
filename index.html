<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Lab">
<meta name="theme-color" content="#0a0e16">
<title>Math Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e16; --bg2:#121826; --panel:#161d2e; --line:rgba(255,255,255,.09);
    --orange:#ff6a1a; --orange-soft:#ff8c45; --cyan:#28d6e6; --amber:#ffcf3f;
    --green:#54e07a; --red:#ff5d5d; --text:#eef3fb; --muted:#8b99b2;
    --display:'Anton', 'Impact', 'Arial Narrow', sans-serif;
    --body:'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --rad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--body); color:var(--text); min-height:100vh;
    background:
      radial-gradient(1200px 520px at 50% -120px, rgba(255,106,26,.16), transparent 60%),
      radial-gradient(900px 500px at 85% 10%, rgba(40,214,230,.08), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    padding:0 16px 56px; padding-bottom:calc(56px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:780px;margin:0 auto}

  /* Scoreboard header */
  header{
    position:sticky; top:0; z-index:20; margin:0 -16px 22px; padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:rgba(10,14,22,.86); backdrop-filter:blur(10px);
    border-bottom:2px solid var(--orange);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:1.5px;margin:0;line-height:1}
  .brand h1 .a{color:var(--orange)} .brand h1 .b{color:var(--cyan)}
  .brand .ball{font-size:22px;line-height:1}
  .readout{display:flex;gap:10px}
  .led{background:#05080f;border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:74px}
  .led .lab{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .led .val{font-family:var(--mono);font-weight:700;font-size:22px;line-height:1.1}
  .led .val.score{color:var(--amber);text-shadow:0 0 12px rgba(255,207,63,.45)}
  .led .val.streak{color:var(--green);text-shadow:0 0 12px rgba(84,224,122,.4)}
  .reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    font-family:var(--body);font-size:12px;padding:6px 10px;cursor:pointer}
  .reset:active{transform:scale(.96)}

  /* Home */
  .tagline{color:var(--muted);font-size:15px;margin:2px 2px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
    padding:18px 18px 16px;transition:transform .14s ease,border-color .14s ease;
    animation:rise .45s ease both;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-4px);border-color:rgba(255,106,26,.55)}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent,var(--orange))}
  .card .icon{font-size:30px;line-height:1}
  .card h2{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:24px;margin:12px 0 4px;line-height:1.05}
  .card .skill{color:var(--muted);font-size:14px;margin:0 0 12px;min-height:38px}
  .card .std{font-family:var(--mono);font-size:11px;color:var(--cyan);opacity:.8}
  .cardrow{display:flex;gap:10px;margin-top:10px}
  .go{display:inline-block;background:var(--orange);color:#1a0a00;font-weight:800;
    border:none;border-radius:10px;padding:9px 16px;font-family:var(--body);font-size:14px;cursor:pointer}
  .go:active{transform:scale(.97)}
  .learn{display:inline-block;background:none;color:var(--cyan);font-weight:800;
    border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-family:var(--body);font-size:14px;cursor:pointer}
  .learn:active{transform:scale(.97)}

  /* Concept view */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .back{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:8px 12px;font-family:var(--body);font-size:14px;cursor:pointer}
  .back:active{transform:scale(.96)}
  .topbar h2{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:26px;margin:0}
  .lvlpill{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--amber);
    border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:#05080f}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
    padding:20px;animation:fade .35s ease both}
  .learnsection{margin-bottom:16px}
  .learnsection h3{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:20px;
    margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .learnsection h3 .std{font-size:12px}
  .lead{font-size:17px;line-height:1.6;margin:0 0 16px}
  .lead b{color:var(--orange-soft)}
  .tip{margin:16px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
  .tip b{color:var(--cyan)}

  /* compare blocks (statistical questions coach) */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0}
  .col{border-radius:12px;padding:14px;border:1px solid var(--line)}
  .col p{font-size:16px;margin:8px 0 6px;font-weight:600}
  .col small{color:var(--muted)}
  .col.not{background:rgba(255,93,93,.07)} .col.yes{background:rgba(84,224,122,.08)}
  .badge{font-family:var(--mono);font-size:11px;letter-spacing:.5px;padding:3px 8px;border-radius:6px}
  .col.not .badge{background:rgba(255,93,93,.18);color:#ffb0b0}
  .col.yes .badge{background:rgba(84,224,122,.18);color:#a9f4bf}

  /* whiteboard worked-example box */
  .whiteboard{background:#f6f7f4;color:#1a2230;border-radius:12px;padding:16px 18px;margin:6px 0}
  .whiteboard .wb-title{font-weight:800;font-size:15px;margin-bottom:8px}
  .whiteboard .wb-data{font-family:var(--mono);font-size:16px;letter-spacing:1px;margin-bottom:6px}
  .whiteboard .wb-row{font-size:16px;margin:8px 0;line-height:1.5}
  .whiteboard .wb-row.hot{color:#c2410c}
  .whiteboard .wb-calc{font-family:var(--mono);font-size:15px;margin:4px 0 10px}
  .whiteboard b{color:#c2410c}

  /* dot plot */
  .dotplot{display:flex;align-items:flex-end;gap:14px;justify-content:center;padding:14px 6px 4px;
    background:rgba(255,255,255,.03);border-radius:12px;margin:8px 0}
  .dotplot.light{background:transparent}
  .dpcol{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;min-height:30px}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--orange)}
  .dotplot.light .dot{background:#d85a30}
  .dpaxis{margin-top:8px;font-family:var(--mono);font-weight:700;font-size:15px}
  .dotplot.light .dpaxis{color:#1a2230}
  .dpaxisline{border-top:2px solid var(--muted);margin-top:6px;padding-top:6px}

  /* standard-algorithm vertical stack (drills) */
  .stack{display:inline-flex;flex-direction:column;align-items:flex-end;
    font-family:var(--mono);font-weight:800;font-size:30px;margin:10px 0;
    background:rgba(255,255,255,.03);border-radius:12px;padding:14px 20px}
  .stackrow{display:flex;gap:10px;align-items:center}
  .stack .op{width:22px;color:var(--cyan);text-align:left;font-size:26px}
  .stack .operand{min-width:1ch}
  .stackline{align-self:stretch;border-top:3px solid var(--text);margin-top:6px}

  /* play */
  .qtext{font-size:19px;line-height:1.5;font-weight:600;margin:6px 0 18px}
  .answers{display:flex;flex-wrap:wrap;gap:12px}
  .opt{flex:1 1 160px;background:var(--bg2);border:1.5px solid var(--line);color:var(--text);
    border-radius:12px;padding:16px;font-family:var(--body);font-weight:700;font-size:16px;cursor:pointer;
    transition:transform .1s ease,border-color .12s ease,background .12s ease}
  .opt:hover{border-color:var(--orange)} .opt:active{transform:scale(.97)}
  .opt.right{border-color:var(--green);background:rgba(84,224,122,.14)}
  .opt.wrong{border-color:var(--red);background:rgba(255,93,93,.14)}
  .numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .numrow input{flex:1;background:var(--bg2);border:1.5px solid var(--line);color:var(--text);
    border-radius:12px;padding:15px 16px;font-family:var(--mono);font-size:22px;font-weight:700;
    outline:none;min-width:0}
  .numrow input:focus{border-color:var(--orange)}
  .fracrow input, .divremrow input{flex:0 1 90px;text-align:center}
  .fracbar{font-size:28px;font-weight:800;color:var(--muted)}
  .check{background:var(--cyan);color:#022a2e;border:none;border-radius:12px;font-weight:800;
    font-family:var(--body);font-size:16px;padding:15px 22px;cursor:pointer}
  .check:active{transform:scale(.97)}

  .feedback{border-radius:12px;padding:16px 18px;margin-top:16px;animation:pop .28s ease both}
  .feedback.good{background:rgba(84,224,122,.12);border:1px solid rgba(84,224,122,.4)}
  .feedback.bad{background:rgba(255,93,93,.10);border:1px solid rgba(255,93,93,.4)}
  .feedback .head{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.5px}
  .feedback.good .head{color:var(--green)} .feedback.bad .head{color:var(--red)}
  .feedback .why{margin-top:8px;font-size:15px;line-height:1.5;color:var(--text)}
  .feedback .why b{color:var(--orange-soft)}
  .next{margin-top:14px;background:var(--orange);color:#1a0a00;border:none;border-radius:12px;
    font-weight:800;font-family:var(--body);font-size:16px;padding:14px 22px;cursor:pointer}
  .next:active{transform:scale(.97)}

  .attribution{color:var(--muted);font-size:12px;text-align:center;margin:24px 0 0}
  .attribution a{color:var(--muted)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @media (max-width:480px){
    .compare{grid-template-columns:1fr}
    .brand h1{font-size:26px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="ball">🏀</span>
      <h1><span class="a">MATH</span> <span class="b">LAB</span></h1>
    </div>
    <div class="readout">
      <div class="led"><div class="lab">Score</div><div class="val score" id="score">0</div></div>
      <div class="led"><div class="lab">Streak</div><div class="val streak" id="streak">0</div></div>
      <button class="reset" data-action="reset">Reset</button>
    </div>
  </header>
  <main id="app"></main>
  <p class="attribution">Some problems use real stats via the <a href="https://statsapi.mlb.com" target="_blank" rel="noopener">MLB Stats API</a> and <a href="https://www.balldontlie.io" target="_blank" rel="noopener">balldontlie.io</a>.</p>
</div>

<script>
  /* Populated by js/skills/*.js, consumed by js/engine.js */
  const SKILLS = {};
</script>
<script src="data/mlb-2025.js"></script>
<script src="data/nba-2024.js"></script>
<script src="data/mls-2025.js"></script>
<script src="js/helpers.js"></script>
<script src="js/skills/data-analysis.js"></script>
<script src="js/skills/fractions.js"></script>
<script src="js/skills/number-fluency.js"></script>
<script src="js/skills/ratios.js"></script>
<script src="js/skills/geometry.js"></script>
<script src="js/skills/expressions.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
