<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Lab">
<meta name="theme-color" content="#0a0e16">
<title>Math Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e16; --bg2:#121826; --panel:#161d2e; --line:rgba(255,255,255,.09);
    --orange:#ff6a1a; --orange-soft:#ff8c45; --cyan:#28d6e6; --amber:#ffcf3f;
    --green:#54e07a; --red:#ff5d5d; --text:#eef3fb; --muted:#8b99b2; --violet:#b389f9;
    --display:'Anton', 'Impact', 'Arial Narrow', sans-serif;
    --body:'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --rad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--body); color:var(--text); min-height:100vh;
    background:
      radial-gradient(1200px 520px at 50% -120px, rgba(255,106,26,.16), transparent 60%),
      radial-gradient(900px 500px at 85% 10%, rgba(40,214,230,.08), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    padding:0 16px 56px; padding-bottom:calc(56px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:780px;margin:0 auto}

  /* Scoreboard header */
  header{
    position:sticky; top:0; z-index:20; margin:0 -16px 22px; padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:rgba(10,14,22,.86); backdrop-filter:blur(10px);
    border-bottom:2px solid var(--orange);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:1.5px;margin:0;line-height:1}
  .brand h1 .a{color:var(--orange)} .brand h1 .b{color:var(--cyan)}
  .brand .ball{font-size:22px;line-height:1}
  .readout{display:flex;gap:10px}
  .led{background:#05080f;border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:74px}
  .led .lab{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .led .val{font-family:var(--mono);font-weight:700;font-size:22px;line-height:1.1}
  .led .val.score{color:var(--amber);text-shadow:0 0 12px rgba(255,207,63,.45)}
  .led .val.streak{color:var(--green);text-shadow:0 0 12px rgba(84,224,122,.4)}
  .reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    font-family:var(--body);font-size:12px;padding:6px 10px;cursor:pointer}
  .reset:active{transform:scale(.96)}

  /* Home */
  .tagline{color:var(--muted);font-size:15px;margin:2px 2px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
    padding:18px 18px 16px;transition:transform .14s ease,border-color .14s ease;
    animation:rise .45s ease both;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-4px);border-color:rgba(255,106,26,.55)}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent,var(--orange))}
  .card .icon{font-size:30px;line-height:1}
  .card h2{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:24px;margin:12px 0 4px;line-height:1.05}
  .card .skill{color:var(--muted);font-size:14px;margin:0 0 12px;min-height:38px}
  .card .std{font-family:var(--mono);font-size:11px;color:var(--cyan);opacity:.8}
  .cardrow{display:flex;gap:10px;margin-top:10px}
  .go{display:inline-block;background:var(--orange);color:#1a0a00;font-weight:800;
    border:none;border-radius:10px;padding:9px 16px;font-family:var(--body);font-size:14px;cursor:pointer}
  .go:active{transform:scale(.97)}
  .learn{display:inline-block;background:none;color:var(--cyan);font-weight:800;
    border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-family:var(--body);font-size:14px;cursor:pointer}
  .learn:active{transform:scale(.97)}

  /* Coach Mode banner — deliberately distinct from the 6 domain cards above,
     since it's a different kind of activity (situational decisions), not a
     7th subject. */
  .coachbanner{display:flex;align-items:center;gap:16px;text-align:left;width:100%;
    background:linear-gradient(135deg, rgba(179,137,249,.14), var(--panel));
    border:1.5px solid rgba(179,137,249,.4);border-radius:var(--rad);
    padding:18px 20px;margin-top:18px;cursor:pointer;
    transition:transform .14s ease,border-color .14s ease;animation:rise .45s ease both}
  .coachbanner:hover{transform:translateY(-4px);border-color:var(--violet)}
  .coachbanner .icon{font-size:34px;line-height:1;flex-shrink:0}
  .coachbanner .body{flex:1;min-width:0}
  .coachbanner h2{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:22px;margin:0 0 4px;color:var(--violet)}
  .coachbanner p{color:var(--muted);font-size:14px;margin:0}
  .coachbanner .go{background:var(--violet);color:#1a0a2e;flex-shrink:0}

  /* Test Mode banner — same shape as Coach Mode's, own accent color so the
     two "beyond the 6 categories" activities read as siblings, not twins. */
  .testbanner{display:flex;align-items:center;gap:16px;text-align:left;width:100%;
    background:linear-gradient(135deg, rgba(84,224,122,.14), var(--panel));
    border:1.5px solid rgba(84,224,122,.4);border-radius:var(--rad);
    padding:18px 20px;margin-top:14px;cursor:pointer;
    transition:transform .14s ease,border-color .14s ease;animation:rise .45s ease both}
  .testbanner:hover{transform:translateY(-4px);border-color:var(--green)}
  .testbanner .icon{font-size:34px;line-height:1;flex-shrink:0}
  .testbanner .body{flex:1;min-width:0}
  .testbanner h2{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:22px;margin:0 0 4px;color:var(--green)}
  .testbanner p{color:var(--muted);font-size:14px;margin:0}
  .testbanner .go{background:var(--green);color:#04210f;flex-shrink:0}

  /* Parent-facing report link — deliberately understated (dashed, muted),
     since it's not part of the kid-facing play loop. */
  .reportlink{display:block;margin:22px auto 0;background:none;border:1px dashed var(--line);color:var(--muted);
    border-radius:10px;padding:8px 14px;font-family:var(--body);font-size:13px;cursor:pointer}
  .reportlink:hover{color:var(--text);border-color:var(--muted)}

  /* Concept view */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .back{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:8px 12px;font-family:var(--body);font-size:14px;cursor:pointer}
  .back:active{transform:scale(.96)}
  .topbar h2{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:26px;margin:0}
  .lvlpill{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--amber);
    border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:#05080f}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
    padding:20px;animation:fade .35s ease both}
  .learnsection{margin-bottom:16px}
  .learnsection h3{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:20px;
    margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .learnsection h3 .std{font-size:12px}
  .lead{font-size:17px;line-height:1.6;margin:0 0 16px}
  .lead b{color:var(--orange-soft)}
  .tip{margin:16px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
  .tip b{color:var(--cyan)}

  /* compare blocks (statistical questions coach) */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0}
  .col{border-radius:12px;padding:14px;border:1px solid var(--line)}
  .col p{font-size:16px;margin:8px 0 6px;font-weight:600}
  .col small{color:var(--muted)}
  .col.not{background:rgba(255,93,93,.07)} .col.yes{background:rgba(84,224,122,.08)}
  .badge{font-family:var(--mono);font-size:11px;letter-spacing:.5px;padding:3px 8px;border-radius:6px}
  .col.not .badge{background:rgba(255,93,93,.18);color:#ffb0b0}
  .col.yes .badge{background:rgba(84,224,122,.18);color:#a9f4bf}

  /* whiteboard worked-example box */
  .whiteboard{background:#f6f7f4;color:#1a2230;border-radius:12px;padding:16px 18px;margin:6px 0}
  .whiteboard .wb-title{font-weight:800;font-size:15px;margin-bottom:8px}
  .whiteboard .wb-data{font-family:var(--mono);font-size:16px;letter-spacing:1px;margin-bottom:6px}
  .whiteboard .wb-row{font-size:16px;margin:8px 0;line-height:1.5}
  .whiteboard .wb-row.hot{color:#c2410c}
  .whiteboard .wb-calc{font-family:var(--mono);font-size:15px;margin:4px 0 10px}
  .whiteboard b{color:#c2410c}

  /* dot plot */
  .dotplot{display:flex;align-items:flex-end;gap:14px;justify-content:center;padding:14px 6px 4px;
    background:rgba(255,255,255,.03);border-radius:12px;margin:8px 0}
  .dotplot.light{background:transparent}
  .dpcol{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;min-height:30px}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--orange)}
  .dotplot.light .dot{background:#d85a30}
  .dpaxis{margin-top:8px;font-family:var(--mono);font-weight:700;font-size:15px}
  .dotplot.light .dpaxis{color:#1a2230}
  .dpaxisline{border-top:2px solid var(--muted);margin-top:6px;padding-top:6px}

  /* ---------- Learn-page visualizations ---------- */

  /* fraction bar */
  .fracbarwrap{margin:14px 0}
  .fracbarlabel{font-size:13px;color:var(--muted);margin-bottom:6px}
  .fracbar-viz{display:flex;height:38px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line)}
  .fracseg{flex:1;background:rgba(255,255,255,.04);border-right:1.5px solid var(--line)}
  .fracseg:last-child{border-right:none}
  .fracseg.filled{background:var(--orange)}
  .fracseg.filled2{background:var(--cyan)}

  /* number line */
  .numberline{position:relative;height:56px;margin:26px 14px 38px}
  .nlaxis{position:absolute;top:26px;left:0;right:0;height:2px;background:var(--line)}
  .nltick{position:absolute;top:32px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-family:var(--mono)}
  .nldot{position:absolute;top:18px;width:16px;height:16px;border-radius:50%;background:var(--orange);
    transform:translateX(-50%);border:2px solid var(--panel)}
  .nlmark{position:absolute;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
  .nlmark::after{content:"";width:2px;height:26px;background:var(--mc,var(--cyan));display:block;margin-top:2px}
  .nlmark span{font-size:11px;color:var(--mc,var(--cyan));font-weight:700;white-space:nowrap}

  /* coordinate grid (SVG, drawn on the light "whiteboard" background) */
  .coordgrid{width:100%;max-width:220px;display:block;margin:14px auto;background:#f6f7f4;border-radius:12px}
  .gridline{stroke:rgba(0,0,0,.08);stroke-width:1}
  .axisline{stroke:#1a2230;stroke-width:1.5}
  .gridpoint{stroke:#1a2230;stroke-width:1}
  .gridlabel{font-size:10px;fill:#1a2230;font-family:var(--mono)}

  /* isometric box diagram (SVG) */
  .boxdiagram{width:100%;max-width:220px;display:block;margin:14px auto}
  .boxtop{fill:#eef3fb;stroke:#1a2230;stroke-width:1.5}
  .boxside{fill:#c7cede;stroke:#1a2230;stroke-width:1.5}
  .boxfront{fill:#dfe4ee;stroke:#1a2230;stroke-width:1.5}
  .boxlabel{font-size:11px;fill:#1a2230;font-family:var(--mono);font-weight:700}

  /* equation balance scale */
  .balance{position:relative;height:110px;margin:22px auto 32px;max-width:320px}
  .balancebar{position:absolute;top:20px;left:0;right:0;height:4px;background:var(--muted);border-radius:2px}
  .fulcrum{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:36px solid #8b99b2}
  .pan{position:absolute;top:24px;width:42%;display:flex;flex-direction:column;align-items:center}
  .pan.left{left:0} .pan.right{right:0}
  .pancontent{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;
    font-family:var(--mono);font-weight:700;font-size:15px;min-width:50px;text-align:center;color:var(--text)}

  /* ratio icon array */
  .ratioviz{margin:14px 0}
  .ratiorow{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
  .ratioicons{font-size:22px;letter-spacing:4px}
  .ratiolabel{color:var(--muted);font-size:13px}

  /* flat 2D shape diagrams (rectangle/triangle/parallelogram/L-shape) */
  .areasvg{width:100%;max-width:240px;display:block;margin:14px auto}
  .areafill{fill:var(--orange);fill-opacity:.55;stroke:#1a2230;stroke-width:1.5}
  .areaoutline{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
  .areadash{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
  .areacut{fill:#0d1117;fill-opacity:.85;stroke:#1a2230;stroke-width:1.5;stroke-dasharray:3 2}
  .arealabel{font-size:11px;fill:#1a2230;font-family:var(--mono);font-weight:700}

  /* standard-algorithm vertical stack (drills) */
  .stack{display:inline-flex;flex-direction:column;align-items:flex-end;
    font-family:var(--mono);font-weight:800;font-size:30px;margin:10px 0;
    background:rgba(255,255,255,.03);border-radius:12px;padding:14px 20px}
  .stackrow{display:flex;gap:10px;align-items:center}
  .stack .op{width:22px;color:var(--cyan);text-align:left;font-size:26px}
  .stack .operand{min-width:1ch}
  .stackline{align-self:stretch;border-top:3px solid var(--text);margin-top:6px}

  /* play — sized so the question reads as the dominant text on the card, not
     smaller than the numbers it's asking about (previously 19px questions
     sat right underneath 22-30px number displays and read as an afterthought) */
  .pretext{color:var(--muted);font-size:16px;line-height:1.5;margin-bottom:8px}
  .datatext{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:1px;margin-bottom:16px}
  .qtext{font-size:23px;line-height:1.45;font-weight:700;margin:10px 0 20px}
  .answers{display:flex;flex-wrap:wrap;gap:12px}
  .opt{flex:1 1 160px;background:var(--bg2);border:1.5px solid var(--line);color:var(--text);
    border-radius:12px;padding:18px;font-family:var(--body);font-weight:700;font-size:18px;cursor:pointer;
    transition:transform .1s ease,border-color .12s ease,background .12s ease}
  .opt:hover{border-color:var(--orange)} .opt:active{transform:scale(.97)}
  .opt.right{border-color:var(--green);background:rgba(84,224,122,.14)}
  .opt.wrong{border-color:var(--red);background:rgba(255,93,93,.14)}

  /* Coach Mode candidate cards — same interaction/feedback language as .opt
     (click to answer, right/wrong highlight), but two lines so the stat is
     visible up front instead of buried in a text label. */
  .statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .statcard{background:var(--bg2);border:1.5px solid var(--line);color:var(--text);
    border-radius:12px;padding:16px;font-family:var(--body);text-align:left;cursor:pointer;
    transition:transform .1s ease,border-color .12s ease,background .12s ease}
  .statcard:hover{border-color:var(--violet)} .statcard:active{transform:scale(.97)}
  .statcard .name{font-weight:800;font-size:18px;display:block;margin-bottom:6px}
  .statcard .stat{font-family:var(--mono);font-size:16px;color:var(--muted)}
  .statcard.right{border-color:var(--green);background:rgba(84,224,122,.14)}
  .statcard.wrong{border-color:var(--red);background:rgba(255,93,93,.14)}
  .numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .numrow input{flex:1;background:var(--bg2);border:1.5px solid var(--line);color:var(--text);
    border-radius:12px;padding:16px;font-family:var(--mono);font-size:25px;font-weight:700;
    outline:none;min-width:0}
  .numrow input:focus{border-color:var(--orange)}
  .fracrow input, .divremrow input{flex:0 1 90px;text-align:center}
  .fracbar{font-size:28px;font-weight:800;color:var(--muted)}
  .check{background:var(--cyan);color:#022a2e;border:none;border-radius:12px;font-weight:800;
    font-family:var(--body);font-size:18px;padding:16px 24px;cursor:pointer}
  .check:active{transform:scale(.97)}

  .feedback{border-radius:12px;padding:16px 18px;margin-top:16px;animation:pop .28s ease both}
  .feedback.good{background:rgba(84,224,122,.12);border:1px solid rgba(84,224,122,.4)}
  .feedback.bad{background:rgba(255,93,93,.10);border:1px solid rgba(255,93,93,.4)}
  .feedback .head{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.5px}
  .feedback.good .head{color:var(--green)} .feedback.bad .head{color:var(--red)}
  .feedback .why{margin-top:8px;font-size:15px;line-height:1.5;color:var(--text)}
  .feedback .why b{color:var(--orange-soft)}
  .next{margin-top:14px;background:var(--orange);color:#1a0a00;border:none;border-radius:12px;
    font-weight:800;font-family:var(--body);font-size:16px;padding:14px 22px;cursor:pointer}
  .next:active{transform:scale(.97)}

  .attribution{color:var(--muted);font-size:12px;text-align:center;margin:24px 0 0}
  .attribution a{color:var(--muted)}

  /* ---------- Progress Report & Test Results ---------- */
  .statrow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .stattile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 20px;min-width:120px}
  .stattile.wide{border-color:rgba(84,224,122,.4);min-width:220px}
  .stattile .n{font-family:var(--mono);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
  .stattile .n .pm{font-size:14px;font-weight:600;color:var(--muted)}
  .stattile .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .reportdomain{margin-bottom:20px}
  .reportdomain h3{font-family:var(--display);font-weight:400;letter-spacing:.5px;font-size:18px;margin:0 0 8px;color:var(--cyan)}
  .reportrow{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
  .reportrow:last-child{border-bottom:none}
  .reportrow .name{flex:0 0 180px;font-size:14px;font-weight:600}
  .reportrow .lvltag{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .reportrow .lvltag.focustag{color:var(--amber);font-weight:700}
  .meterwrap{flex:1;display:flex;align-items:center;gap:10px;min-width:80px}
  .meterbar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;min-width:40px}
  .meterfill{height:100%;border-radius:6px}
  .meterfill.good{background:var(--green)}
  .meterfill.warn{background:var(--amber)}
  .meterfill.bad{background:var(--red)}
  .metertext{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .metersub{color:var(--muted)}
  .testsession{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);
    font-size:14px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .testsession:last-child{border-bottom:none}
  .testsession .acc.good{color:var(--green)} .testsession .acc.warn{color:var(--amber)} .testsession .acc.bad{color:var(--red)}
  .testsession .mapscore{color:var(--cyan);font-weight:700}
  .clearhist{margin-top:6px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    padding:8px 14px;font-family:var(--body);font-size:13px;cursor:pointer}
  .clearhist:hover{color:var(--red);border-color:var(--red)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @media (max-width:480px){
    .compare{grid-template-columns:1fr}
    .brand h1{font-size:26px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="ball">🏀</span>
      <h1><span class="a">MATH</span> <span class="b">LAB</span></h1>
    </div>
    <div class="readout">
